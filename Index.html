<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You Erjona — 3D Volumetric Heart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>a
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
  
        :root {
            --bg-void: #050102;
            --bg-radial: #1c0307;
            --glow-primary: #ef1a2d;
            --glow-secondary: #ff6b7a;
            --glow-ambient: rgba(239, 26, 45, 0.34);
            --text-core: #fff2f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, var(--bg-radial) 0%, var(--bg-void) 78%);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-core);
            touch-action: none;
        }

        
        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

                .stage {
            position: fixed;
            inset: 0;
            z-index: 2;
            cursor: grab;
        }

        .stage:active {
            cursor: grabbing;
        }

        
        .dedication-footer {
            position: fixed;
            bottom: clamp(1.75rem, 5vh, 3.25rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            text-align: center;
            pointer-events: none;
        }

        .dedication-divider {
            width: clamp(90px, 18vw, 170px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 122, 0.65), transparent);
            opacity: 0;
            animation: fadeInSignature 2.2s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
        }

        .dedication-text {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(1.35rem, 3.2vw, 2.15rem);
            letter-spacing: 0.03em;
            color: #fff2f4;
            text-shadow: 0 0 18px rgba(239, 26, 45, 0.75), 0 2px 12px rgba(0, 0, 0, 0.85);
            opacity: 0;
            animation: fadeInSignature 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
        }

        @keyframes fadeInSignature {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 0.96;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    
    <canvas id="particle-canvas"></canvas>

    
    <main class="stage" id="interaction-stage"></main>

        <footer class="dedication-footer">
        <div class="dedication-divider"></div>
        <p class="dedication-text">I will always love you no matter what</p>
    </footer>

    <script>
        class VolumetricHeartExperience {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d', { alpha: true });
                this.stage = document.getElementById('interaction-stage');

                this.palette = {
                    textCore: '#fff2f4',
                    textGlow: '#ef1a2d',
                    shades: ['#b91c1c', '#dc2626', '#ef1a2d', '#f87171', '#ff4d5e'],
                    pedestalCore: 'rgba(239, 26, 45, 0.34)',
                    pedestalMid: 'rgba(255, 77, 94, 0.10)'
                };

                this.state = {
                    phrase: 'I love you Erjona',
                    width: window.innerWidth,
                    height: window.innerHeight,
                    dpr: Math.min(window.devicePixelRatio || 1, 2),
                    rotX: -5,
                    rotY: 0,
                    velX: 0,
                    velY: 0.28,
                    parallaxX: 0,
                    parallaxY: 0,
                    targetParallaxX: 0,
                    targetParallaxY: 0,
                    isDragging: false,
                    lastPointerX: 0,
                    lastPointerY: 0,
                    flowPhase: 0,
                    fov: 1100
                };

                this.textNodes = [];
                this.heartParticles = [];
                this.stardustParticles = [];
                this.spriteCache = {};
                this.textSprite = null;
                this.lastTime = performance.now();

                this.buildGlowSprites();
                this.buildTextSprite();
                this.bindEvents();
                this.handleResize();
                this.animate(this.lastTime);
            }

            buildGlowSprites() {
                this.spriteCache = {};
                const size = 64;
                const half = size / 2;

                this.palette.shades.forEach((color) => {
                    const offscreen = document.createElement('canvas');
                    offscreen.width = size;
                    offscreen.height = size;
                    const octx = offscreen.getContext('2d');

                    const grad = octx.createRadialGradient(half, half, 0, half, half, half);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.25, color);
                    grad.addColorStop(0.6, color + '55');
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    octx.fillStyle = grad;
                    octx.fillRect(0, 0, size, size);
                    this.spriteCache[color] = offscreen;
                });
            }

            buildTextSprite() {
                const scale = this.getHeartScale();
                const fontSize = Math.max(12, Math.round(scale * 0.85));
                const dpr = this.state.dpr;

                const measureCanvas = document.createElement('canvas');
                const mctx = measureCanvas.getContext('2d');
                mctx.font = `600 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
                const metrics = mctx.measureText(this.state.phrase);

                const padding = 28;
                const logicalW = Math.ceil(metrics.width + padding * 2);
                const logicalH = Math.ceil(fontSize * 2.2 + padding);

                const offscreen = document.createElement('canvas');
                offscreen.width = logicalW * dpr;
                offscreen.height = logicalH * dpr;
                const octx = offscreen.getContext('2d');
                octx.scale(dpr, dpr);

                octx.font = `600 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
                octx.textAlign = 'center';
                octx.textBaseline = 'middle';

                octx.shadowColor = this.palette.textGlow;
                octx.shadowBlur = 14;
                octx.fillStyle = this.palette.textCore;
                octx.fillText(this.state.phrase, logicalW * 0.5, logicalH * 0.5);

                octx.shadowBlur = 5;
                octx.fillText(this.state.phrase, logicalW * 0.5, logicalH * 0.5);

                this.textSprite = {
                    canvas: offscreen,
                    logicalW,
                    logicalH
                };
            }

            getHeartPoint(t) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return { x, y };
            }

            getHeartScale() {
                const minDim = Math.min(this.state.width, this.state.height);
                return Math.max(9.5, Math.min(18.5, minDim * 0.022));
            }
            buildTypographyLattice() {
                this.textNodes = [];

                const layers = [
                    { z: -38, scaleMul: 0.92, count: 24, alpha: 0.22, speedDir: -0.75 },
                    { z: 0,   scaleMul: 1.00, count: 38, alpha: 1.00, speedDir: 1.00 },
                    { z: 38,  scaleMul: 0.92, count: 24, alpha: 0.22, speedDir: -0.75 }
                ];

                layers.forEach((layer, layerIdx) => {
                    const phaseOffset = (layerIdx * Math.PI) / layers.length;
                    for (let i = 0; i < layer.count; i++) {
                        this.textNodes.push({
                            baseT: (i / layer.count) * Math.PI * 2 + phaseOffset,
                            z: layer.z,
                            scaleMul: layer.scaleMul,
                            baseAlpha: layer.alpha,
                            speedDir: layer.speedDir
                        });
                    }
                });
            }

            createHeartParticle(randomLife = false) {
                const pal = this.palette;
                const scale = this.getHeartScale();
                const t = Math.random() * Math.PI * 2;
                const pt = this.getHeartPoint(t);

                const spread = (Math.random() - 0.5) * 1.8;
                const zDepth = (Math.random() - 0.5) * 105;

                const maxLife = 130 + Math.random() * 140;
                return {
                    bx: pt.x * (scale + spread),
                    by: pt.y * (scale + spread) - 18,
                    bz: zDepth,
                    orbitRadius: 1.5 + Math.random() * 4.5,
                    phase: Math.random() * Math.PI * 2,
                    freq: 0.014 + Math.random() * 0.018,
                    size: 1.1 + Math.random() * 1.6,
                    color: pal.shades[Math.floor(Math.random() * pal.shades.length)],
                    life: randomLife ? Math.random() * maxLife : 0,
                    maxLife
                };
            }

            createStardustParticle(randomY = false) {
                const pal = this.palette;
                const maxLife = 260 + Math.random() * 200;
                return {
                    x: Math.random() * this.state.width,
                    y: randomY ? Math.random() * this.state.height : this.state.height + 10,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: -(0.18 + Math.random() * 0.35),
                    size: 0.9 + Math.random() * 1.4,
                    color: pal.shades[Math.floor(Math.random() * pal.shades.length)],
                    twinkleOffset: Math.random() * Math.PI * 2,
                    life: randomY ? Math.random() * maxLife : 0,
                    maxLife
                };
            }

            initParticles() {
                this.heartParticles = [];
                this.stardustParticles = [];

                for (let i = 0; i < 110; i++) {
                    this.heartParticles.push(this.createHeartParticle(true));
                }

                for (let i = 0; i < 50; i++) {
                    this.stardustParticles.push(this.createStardustParticle(true));
                }
            }

            project3DPoint(x, y, z, pulseScale) {
                const sx = x * pulseScale;
                const sy = y * pulseScale;
                const sz = z * pulseScale;

                const radY = (this.state.rotY * Math.PI) / 180;
                const radX = (this.state.rotX * Math.PI) / 180;

                const cosY = Math.cos(radY);
                const sinY = Math.sin(radY);
                const x1 = sx * cosY + sz * sinY;
                const z1 = -sx * sinY + sz * cosY;

                const cosX = Math.cos(radX);
                const sinX = Math.sin(radX);
                const y2 = sy * cosX - z1 * sinX;
                const z2 = sy * sinX + z1 * cosX;

                const perspective = this.state.fov / Math.max(220, this.state.fov - z2);
                return {
                    px: this.state.width * 0.5 + x1 * perspective,
                    py: this.state.height * 0.48 + y2 * perspective,
                    z: z2,
                    scale: perspective
                };
            }

            drawVolumetricPedestal(pulseScale) {
                const pal = this.palette;
                const scale = this.getHeartScale();
                const cx = this.state.width * 0.5;
                const cy = this.state.height * 0.48 + scale * 17.0;
                const rx = scale * 13.0 * pulseScale;
                const ry = scale * 2.4 * pulseScale;

                this.ctx.save();
                this.ctx.translate(cx, cy);
                this.ctx.scale(1, ry / rx);

                const grad = this.ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
                grad.addColorStop(0, pal.pedestalCore);
                grad.addColorStop(0.55, pal.pedestalMid);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                this.ctx.fillStyle = grad;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, rx, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            }

            drawCoreMonogram(pulseScale) {
                const proj = this.project3DPoint(0, -14, 0, pulseScale);
                const scale = this.getHeartScale();
                const fontSize = Math.round(scale * 7.2 * proj.scale);
                const beatBoost = (pulseScale - 1) * 4.5;

                this.ctx.save();
                this.ctx.globalCompositeOperation = 'lighter';
                this.ctx.globalAlpha = 0.085 + beatBoost;
                this.ctx.font = `italic 600 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.shadowColor = '#ef1a2d';
                this.ctx.shadowBlur = 24;
                this.ctx.fillStyle = '#ff6b7a';
                this.ctx.fillText('E', proj.px, proj.py);
                this.ctx.restore();
            }

            bindEvents() {
                const onPointerDown = (e) => {
                    this.state.isDragging = true;
                    const pt = e.touches ? e.touches[0] : e;
                    this.state.lastPointerX = pt.clientX;
                    this.state.lastPointerY = pt.clientY;
                };

                const onPointerMove = (e) => {
                    const pt = e.touches ? e.touches[0] : e;
                    const nx = (pt.clientX / Math.max(1, this.state.width)) * 2 - 1;
                    const ny = (pt.clientY / Math.max(1, this.state.height)) * 2 - 1;
                    this.state.targetParallaxX = nx * 9;
                    this.state.targetParallaxY = -ny * 7;

                    if (!this.state.isDragging) return;
                    const dx = pt.clientX - this.state.lastPointerX;
                    const dy = pt.clientY - this.state.lastPointerY;

                    this.state.velY = dx * 0.35;
                    this.state.velX = -dy * 0.25;
                    this.state.rotY = (this.state.rotY + this.state.velY) % 360;
                    this.state.rotX = Math.max(-45, Math.min(45, this.state.rotX + this.state.velX));

                    this.state.lastPointerX = pt.clientX;
                    this.state.lastPointerY = pt.clientY;
                };

                const onPointerUp = () => {
                    this.state.isDragging = false;
                };

                const onPointerLeave = () => {
                    this.state.isDragging = false;
                    this.state.targetParallaxX = 0;
                    this.state.targetParallaxY = 0;
                };

                this.stage.addEventListener('mousedown', onPointerDown);
                window.addEventListener('mousemove', onPointerMove, { passive: true });
                window.addEventListener('mouseup', onPointerUp);
                document.addEventListener('mouseleave', onPointerLeave);

                this.stage.addEventListener('touchstart', onPointerDown, { passive: true });
                window.addEventListener('touchmove', onPointerMove, { passive: true });
                window.addEventListener('touchend', onPointerUp);

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => this.handleResize(), 120);
                });
            }

            handleResize() {
                this.state.width = window.innerWidth;
                this.state.height = window.innerHeight;
                this.state.dpr = Math.min(window.devicePixelRatio || 1, 2);

                this.canvas.width = this.state.width * this.state.dpr;
                this.canvas.height = this.state.height * this.state.dpr;
                this.ctx.setTransform(this.state.dpr, 0, 0, this.state.dpr, 0, 0);

                this.buildTextSprite();
                this.buildTypographyLattice();
                this.initParticles();
            }

            animate(now) {
                const dt = Math.min((now - this.lastTime) / 1000, 0.05) || 0.016;
                this.lastTime = now;

                
                this.state.parallaxX += (this.state.targetParallaxX - this.state.parallaxX) * 0.06;
                this.state.parallaxY += (this.state.targetParallaxY - this.state.parallaxY) * 0.06;

                
                if (!this.state.isDragging) {
                    this.state.velY += (0.28 - this.state.velY) * 0.03;
                    this.state.velX *= 0.92;

                    this.state.rotY = (this.state.rotY + this.state.velY + this.state.parallaxX * 0.025) % 360;
                    const targetTilt = Math.sin(now * 0.0008) * 4.5 + this.state.parallaxY;
                    this.state.rotX += (targetTilt - this.state.rotX) * 0.035 + this.state.velX;
                }

                
                const beatCycle = (now * 0.0023) % (Math.PI * 2);
                const pulseScale = 1 + Math.pow(Math.sin(beatCycle), 4) * 0.038;

                
                this.state.flowPhase += dt * 0.16;

                
                this.ctx.clearRect(0, 0, this.state.width, this.state.height);
                this.drawVolumetricPedestal(pulseScale);
                this.drawCoreMonogram(pulseScale);


                this.ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < this.stardustParticles.length; i++) {
                    const p = this.stardustParticles[i];
                    p.life++;
                    p.x += p.vx + Math.sin(p.life * 0.016) * 0.1;
                    p.y += p.vy;

                    if (p.life >= p.maxLife || p.y < -12) {
                        this.stardustParticles[i] = this.createStardustParticle(false);
                        continue;
                    }

                    const fade = Math.sin((p.life / p.maxLife) * Math.PI);
                    const twinkle = 0.65 + 0.35 * Math.sin(now * 0.004 + p.twinkleOffset);
                    const alpha = fade * twinkle * 0.55;

                    if (alpha > 0.02) {
                        const sprite = this.spriteCache[p.color];
                        const drawSize = p.size * 5.5;
                        this.ctx.globalAlpha = alpha;
                        this.ctx.drawImage(sprite, p.x - drawSize * 0.5, p.y - drawSize * 0.5, drawSize, drawSize);
                    }
                }

                
                const scale = this.getHeartScale();
                const renderQueue = [];

                for (let i = 0; i < this.textNodes.length; i++) {
                    const node = this.textNodes[i];
                    const t = node.baseT + this.state.flowPhase * node.speedDir;
                    const pt = this.getHeartPoint(t);
                    const ptNext = this.getHeartPoint(t + 0.02);

                    const x = pt.x * scale * node.scaleMul;
                    const y = pt.y * scale * node.scaleMul - 18;
                    const xNext = ptNext.x * scale * node.scaleMul;
                    const yNext = ptNext.y * scale * node.scaleMul - 18;

                    const proj = this.project3DPoint(x, y, node.z, pulseScale);
                    const projNext = this.project3DPoint(xNext, yNext, node.z, pulseScale);

                    // Compute subtle tangent tilt (22%) so text hugs the heart ribbon organically
                    let tangentAngle = Math.atan2(projNext.py - proj.py, projNext.px - proj.px);
                    if (tangentAngle > Math.PI * 0.5) tangentAngle -= Math.PI;
                    if (tangentAngle < -Math.PI * 0.5) tangentAngle += Math.PI;

                    renderQueue.push({
                        type: 'text',
                        proj,
                        alpha: node.baseAlpha,
                        angle: tangentAngle * 0.22
                    });
                }

                for (let i = 0; i < this.heartParticles.length; i++) {
                    const p = this.heartParticles[i];
                    p.life++;
                    p.phase += p.freq;

                    if (p.life >= p.maxLife) {
                        this.heartParticles[i] = this.createHeartParticle(false);
                        continue;
                    }

                    const ox = p.bx + Math.cos(p.phase) * p.orbitRadius;
                    const oy = p.by + Math.sin(p.phase * 1.3) * p.orbitRadius;
                    const oz = p.bz + Math.sin(p.phase * 0.8) * p.orbitRadius;

                    const proj = this.project3DPoint(ox, oy, oz, pulseScale);
                    const fade = Math.sin((p.life / p.maxLife) * Math.PI);
                    renderQueue.push({
                        type: 'sparkle',
                        proj,
                        alpha: fade * 0.75,
                        size: p.size,
                        color: p.color
                    });
                }

                
                
                renderQueue.sort((a, b) => a.proj.z - b.proj.z);

                
                
                const spriteW = this.textSprite.logicalW;
                const spriteH = this.textSprite.logicalH;
                const spriteCanvas = this.textSprite.canvas;

                for (let i = 0; i < renderQueue.length; i++) {
                    const item = renderQueue[i];
                    const { px, py, z, scale: pScale } = item.proj;

                    const depthFactor = Math.max(0.28, Math.min(1.0, (z + 160) / 280));
                    const finalAlpha = item.alpha * depthFactor;
                    if (finalAlpha <= 0.02) continue;

                    if (item.type === 'text') {
                        this.ctx.save();
                        this.ctx.globalCompositeOperation = 'source-over';
                        this.ctx.globalAlpha = finalAlpha;
                        this.ctx.translate(px, py);
                        this.ctx.rotate(item.angle);
                        const w = spriteW * pScale;
                        const h = spriteH * pScale;
                        this.ctx.drawImage(spriteCanvas, -w * 0.5, -h * 0.5, w, h);
                        this.ctx.restore();
                    } else {
                        this.ctx.globalCompositeOperation = 'lighter';
                        this.ctx.globalAlpha = finalAlpha;
                        const sprite = this.spriteCache[item.color];
                        const drawSize = item.size * pScale * 6.5;
                        this.ctx.drawImage(sprite, px - drawSize * 0.5, py - drawSize * 0.5, drawSize, drawSize);
                    }
                }

                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.globalAlpha = 1;

                requestAnimationFrame((t) => this.animate(t));
            }
        }

        
          window.addEventListener('DOMContentLoaded', () => {
            new VolumetricHeartExperience();
        });
    </script>
</body>
</html>
